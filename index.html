<!DOCTYPE html>
<html lang="cs">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AION 2 EU - Časovač Riftů</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

</head>


<body>

    <div id="app">

        <main class="card">


            <!-- NADPIS -->

            <div class="eyebrow">
                DALŠÍ ČASOPROSTOROVÝ RIFT
            </div>


            <!-- ODPOČET -->

            <div
                id="timer"
                class="timer"
            >
                --:--:--
            </div>


            <!-- ČAS DALŠÍHO RIFTU -->

            <div class="open">

                OTEVÍRÁ SE V

                <strong id="nextTime">
                    --:--
                </strong>

                · EVROPA

            </div>


            <!-- ZDROJ -->

            <div class="source">

                AION 2 EU
                <b>· ČASOVÝ ROZVRH RIFTŮ</b>

            </div>


            <!-- POP OUT TIMER -->

            <button
                id="popupButton"
                class="popup-button"
                type="button"
            >
                ⧉ POP OUT TIMER
            </button>


        </main>

    </div>


    <!-- JavaScript -->

    <script src="script.js"></script>

</body>

</html>
