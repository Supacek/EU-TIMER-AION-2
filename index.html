<!DOCTYPE html>
<html lang="cs">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AION 2 EU - Časovač Riftů</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css?v=2">

</head>


<body>

    <div id="app">

        <main class="card">


            <!-- NADPIS -->

            <div class="eyebrow">
                DALŠÍ ČASOPROSTOROVÝ RIFT
            </div>


            <!-- ODPOČET -->

            <div
                id="timer"
                class="timer"
            >
                --:--:--
            </div>


            <!-- ČAS DALŠÍHO RIFTU -->

            <div class="open">

                OTEVÍRÁ SE V

                <strong id="nextTime">
                    --:--
                </strong>

                · EVROPA

            </div>


            <!-- POP OUT TIMER -->

            <button
                id="popupButton"
                class="popup-button"
                type="button"
            >
                ▣ POP OUT TIMER
            </button>


            <!-- DNEŠNÍ ROZVRH RIFTŮ -->

            <section class="schedule">

                <div class="schedule-title">

                    DNEŠNÍ ROZVRH RIFTŮ

                    <span class="schedule-badge">
                        EU
                    </span>

                </div>


                <!-- RIFTY -->

                <div
                    id="riftSchedule"
                    class="rift-schedule"
                >

                    <div
                        class="rift-time"
                        data-hour="2"
                    >
                        02:00
                    </div>

                    <div
                        class="rift-time"
                        data-hour="5"
                    >
                        05:00
                    </div>

                    <div
                        class="rift-time"
                        data-hour="8"
                    >
                        08:00
                    </div>

                    <div
                        class="rift-time"
                        data-hour="11"
                    >
                        11:00
                    </div>

                    <div
                        class="rift-time"
                        data-hour="14"
                    >
                        14:00
                    </div>

                    <div
                        class="rift-time"
                        data-hour="17"
                    >
                        17:00
                    </div>

                    <div
                        class="rift-time"
                        data-hour="20"
                    >
                        20:00
                    </div>

                    <div
                        class="rift-time"
                        data-hour="23"
                    >
                        23:00
                    </div>

                </div>

            </section>


            <!-- ZDROJ -->

            <div class="source">

                AION 2 EU
                <b>· ČASOVÝ ROZVRH RIFTŮ</b>

            </div>


        </main>

    </div>


    <!-- JavaScript -->

    <script src="script.js?v=2"></script>

</body>

</html>
