<!DOCTYPE html>
<html lang="cs">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AION 2 EU - Časovač Riftů</title>

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="style.css?v=3"
    >

</head>


<body>

    <div id="app">

        <main class="card">


            <!-- =========================================
                 NADPIS
                 ========================================= -->

            <div class="eyebrow">
                DALŠÍ SPACETIME RIFT
            </div>


            <!-- =========================================
                 ODPOČET
                 ========================================= -->

            <div
                id="timer"
                class="timer"
            >
                --:--:--
            </div>


            <!-- =========================================
                 ČAS DALŠÍHO RIFTU
                 ========================================= -->

            <div class="open">

                OTEVÍRÁ SE V

                <strong id="nextTime">
                    --:--
                </strong>

                · EVROPA

            </div>


            <!-- =========================================
                 OVLÁDÁNÍ
                 ========================================= -->

            <div class="controls">


                <!-- NOTIFIKACE -->

                <button
                    id="notifyButton"
                    class="notify-button"
                    type="button"
                >
                    🔔 UPOZORNIT MĚ
                </button>


                <!-- POP OUT -->

                <button
                    id="popupButton"
                    class="popup-button"
                    type="button"
                >
                    ▣ POP OUT TIMER
                </button>


            </div>


            <!-- =========================================
                 DNEŠNÍ ROZVRH RIFTŮ
                 ========================================= -->

            <section class="schedule">


                <!-- NADPIS -->

                <div class="schedule-title">

                    DNEŠNÍ ROZVRH RIFTŮ

                    <span class="schedule-badge">
                        EU
                    </span>

                </div>


                <!-- =====================================
                     RIFTY
                     ===================================== -->

                <div
                    id="riftSchedule"
                    class="rift-schedule"
                >


                    <!-- 02:00 -->

                    <div
                        class="rift-time"
                        data-hour="2"
                    >
                        02:00
                    </div>


                    <!-- 05:00 -->

                    <div
                        class="rift-time"
                        data-hour="5"
                    >
                        05:00
                    </div>


                    <!-- 08:00 -->

                    <div
                        class="rift-time"
                        data-hour="8"
                    >
                        08:00
                    </div>


                    <!-- 11:00 -->

                    <div
                        class="rift-time"
                        data-hour="11"
                    >
                        11:00
                    </div>


                    <!-- 14:00 -->

                    <div
                        class="rift-time"
                        data-hour="14"
                    >
                        14:00
                    </div>


                    <!-- 17:00 -->

                    <div
                        class="rift-time"
                        data-hour="17"
                    >
                        17:00
                    </div>


                    <!-- 20:00 -->

                    <div
                        class="rift-time"
                        data-hour="20"
                    >
                        20:00
                    </div>


                    <!-- 23:00 -->

                    <div
                        class="rift-time"
                        data-hour="23"
                    >
                        23:00
                    </div>


                </div>

            </section>


<!-- =========================================
     ZDROJ / AUTOR
     ========================================= -->

<div class="source">

    <span class="creator">
        · VYTVOŘIL
        <span class="c1">S</span><span class="c2">u</span><span class="c3">p</span><span class="c4">a</span><span class="c5">c</span><span class="c6">e</span><span class="c7">e</span><span class="c8">K</span>
    </span>

</div>


    <!-- =========================================
         JAVASCRIPT
         ========================================= -->

    <script src="script.js?v=4"></script>

</body>

</html>
