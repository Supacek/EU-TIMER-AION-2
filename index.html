<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AION 2 EU Timer</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>


<body>

    <div id="app">

        <main class="card">

            <!-- TITLE -->
            <div class="eyebrow">
                NEXT SPACETIME RIFT
            </div>


            <!-- TIMER -->
            <div
                id="timer"
                class="timer"
            >
                --:--:--
            </div>


            <!-- NEXT RIFT TIME -->
            <div class="open">
                OTEVIRA SE 
                <strong id="nextTime">
                    --:--
                </strong>
                · Europe
            </div>


            <!-- FOOTER -->
            <div class="source">
                AION 2 EU server schedule
                <b>(GMT+9)</b>
            </div>

        </main>

    </div>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
